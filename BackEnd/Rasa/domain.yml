version: "3.1"

intents:
  - greet
  - goodbye
  - ask_tour_northern

actions:
  - action_show_northern_tours
  - action_default_fallback

responses:
  # Phản hồi cho chào hỏi
  utter_greet:
    - text: "Hey! How are you?"  # Tiếng Anh
    - text: "Chào bạn! Bạn khỏe không?"  # Tiếng Việt

  # Phản hồi tạm biệt
  utter_goodbye:
    - text: "Bye"  # Tiếng Anh
    - text: "Tạm biệt"  # Tiếng Việt

  # Phản hồi khi không hiểu câu hỏi
  utter_default:
    - text: "Sorry, I didn't understand that. Please try again."  # Tiếng Anh
    - text: "Xin lỗi, tôi không hiểu câu hỏi của bạn. Vui lòng thử lại."  # Tiếng Việt

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
